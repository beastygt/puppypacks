        /* pack shape - tall with folded flap, gold trim */
        .hearth-pack-wrap{ position:relative; width: min(210px, 68vw); height: 304px; perspective: 900px; transform-style: preserve-3d; max-width:100%; box-sizing:border-box; }
        @media (min-width: 640px){ .hearth-pack-wrap{ width: 230px; height: 330px; } }
        .hearth-pack-shadow{ position:absolute; bottom:-18px; left:12%; right:12%; height:28px; background: radial-gradient(50% 100% at 50% 0%, rgba(0,0,0,0.22), transparent); filter: blur(2px); }

        .hearth-pack-wrap.burst .pack-flap{ transform: rotateX(-108deg); }
        .hearth-pack-wrap.burst{ animation: packBurstUp 0.42s cubic-bezier(.2,.8,.3,1) forwards; }
        .pack-clickable:hover{ transform: scale(1.03); }
        .pack-clickable:active{ transform: scale(0.97); }
        .pack-clickable{ transition: transform 0.18s ease, filter 0.2s ease; }
        .pack-clickable:hover .hearth-pack{ filter: drop-shadow(0 10px 24px rgba(251,191,36,0.35)); }
        @keyframes packFloat{ 0%,100%{ transform: translateY(0) rotateZ(-0.6deg);} 50%{ transform: translateY(-10px) rotateZ(0.8deg);} }
        @keyframes packShake{ 0%,100%{ transform: translateX(0) rotate(0);} 25%{ transform: translateX(-6px) rotate(-3deg);} 75%{ transform: translateX(6px) rotate(3deg);} }
        @keyframes packBurstUp{ 0%{ transform: translateY(0) scale(1);} 40%{ transform: translateY(-10px) scale(1.04);} 100%{ transform: translateY(-8px) scale(0.98);} }
        .pack-body{

          border-radius: 0 0 18px 18px;

        }

          position:absolute; inset:0; border-radius:9999px;
